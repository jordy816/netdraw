name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/test-model.mjs
      - name: Build installer, zip and portable exe
        run: npx electron-builder --win nsis zip portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: netdraw-windows
          path: |
            dist/*.exe
            dist/*.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
